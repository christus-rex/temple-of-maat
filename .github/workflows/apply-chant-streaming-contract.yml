name: Apply chant streaming release contract

on:
  push:
    branches:
      - fix/chant-streaming-drive-archive
    paths:
      - .github/workflows/apply-chant-streaming-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chant-streaming-drive-archive
          fetch-depth: 0

      - name: Patch service-worker and validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'{path}: missing expected text: {old!r}')
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'sw.js',
              "const VERSION = 'temple-maat-pwa-v5.2.8-library-journey-offline-2026-08-14-r2';",
              "const VERSION = 'temple-maat-pwa-v5.2.8-library-journey-offline-2026-08-14-r3';",
              1,
          )
          replace(
              'sw.js',
              '// Shell revision r2: strict core install, fresh release identity, and isolated cache promotion.',
              '// Shell revision r3: chant web fallback, strict core install, fresh release identity, and isolated cache promotion.',
              1,
          )
          replace(
              'sw.js',
              '// Canonical ritual audio lives in IndexedDB only after explicit visitor installation.\n',
              '// Canonical ritual audio lives in IndexedDB only after explicit visitor installation.\n      // The published compact chant rendition remains network-only and never enters Cache Storage.\n',
              1,
          )

          replace(
              'scripts/validate-v5.2.8-release.mjs',
              "const namespace = 'temple-maat-pwa-v5.2.8-library-journey-offline-2026-08-14-r2';",
              "const namespace = 'temple-maat-pwa-v5.2.8-library-journey-offline-2026-08-14-r3';",
              1,
          )
          replace(
              'scripts/validate-v5.2.8-release.mjs',
              "fail('Service-worker namespace does not match final v5.2.8 debug-hardening shell revision')",
              "fail('Service-worker namespace does not match final v5.2.8 chant-streaming shell revision')",
              1,
          )
          replace(
              'scripts/validate-v5.2.8-release.mjs',
              'Validated Temple ${version.version} release candidate: exact release/build identity, atomic r2 service-worker shell, fresh release identity,',
              'Validated Temple ${version.version} release candidate: exact release/build identity, atomic r3 service-worker shell, fresh release identity,',
              1,
          )
          replace(
              'scripts/validate-v5.2.8-release.mjs',
              "  'scripts/smoke-release-hardening-v5.2.8.mjs',\n",
              "  'scripts/smoke-release-hardening-v5.2.8.mjs',\n  'scripts/smoke-chant-streaming-v5.2.8.mjs',\n",
              1,
          )
          replace(
              'scripts/validate-v5.2.8-release.mjs',
              "  '.github/workflows/smoke-release-hardening-v5.2.8.yml',\n",
              "  '.github/workflows/smoke-release-hardening-v5.2.8.yml',\n  '.github/workflows/smoke-chant-streaming-v5.2.8.yml',\n",
              1,
          )

          replace(
              'scripts/validate-welcome-version-v5.2.8.mjs',
              'Shell revision r2: strict core install, fresh release identity, and isolated cache promotion.',
              'Shell revision r3: chant web fallback, strict core install, fresh release identity, and isolated cache promotion.',
              1,
          )
          replace(
              'scripts/validate-welcome-version-v5.2.8.mjs',
              'Service-worker r2 shell refresh marker missing for welcome version rollout',
              'Service-worker r3 shell refresh marker missing for welcome version rollout',
              1,
          )

          replace(
              'scripts/validate-v5.2.5.mjs',
              "  'assets/audio/maat-forty-two-declarations.json',\n",
              "  'assets/audio/maat-forty-two-declarations.json',\n  'assets/audio/maat-forty-two-declarations.web.opus',\n",
              1,
          )
          replace(
              'scripts/validate-v5.2.5.mjs',
              "if (audioMeta.distribution?.mode !== 'indexeddb-device-install') fail('Audio distribution mode must remain device-local IndexedDB installation');\nif (audioMeta.distribution?.networkUpload !== false) fail('Audio metadata must not claim a network upload');",
              "if (audioMeta.distribution?.mode !== 'web-rendition-plus-indexeddb-canonical') fail('Audio distribution mode must expose web streaming plus canonical IndexedDB installation');\nif (audioMeta.distribution?.webStreaming !== true || audioMeta.distribution?.canonicalRepoUpload !== false) fail('Audio distribution boundary drifted');\nif (audioMeta.preparedWebRendition?.status !== 'published' || audioMeta.preparedWebRendition?.path !== 'assets/audio/maat-forty-two-declarations.web.opus') fail('Published chant web rendition metadata is incomplete');\nif (audioMeta.preparedWebRendition?.bytes !== 1336596 || audioMeta.preparedWebRendition?.sha256 !== 'b82360e17adf2240ca8ac8071a8d20ce295bfb6c38f143a4b3367ab90afee94b') fail('Published chant web rendition fingerprint drifted');\nif (fs.statSync(file('assets/audio/maat-forty-two-declarations.web.opus')).size !== 1336596) fail('Published chant web rendition byte count drifted');",
              1,
          )
          replace(
              'scripts/validate-v5.2.5.mjs',
              'and SHA-verified IndexedDB ritual-media vault.',
              'web-streamed no-autoplay chant fallback, and SHA-verified IndexedDB canonical ritual-media vault.',
              1,
          )
          PY

      - name: Commit release contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js scripts/validate-v5.2.8-release.mjs scripts/validate-welcome-version-v5.2.8.mjs scripts/validate-v5.2.5.mjs
          git diff --cached --check
          git commit -m 'release: harden chant streaming cache and validation contract'
          git push origin HEAD:fix/chant-streaming-drive-archive
