name: Apply Ferrara Library catalog patch

on:
  push:
    branches:
      - feature/v5.2.8-ferrara-library-ingest
    paths:
      - 'scripts/patch-ferrara-library.py'
      - '.github/workflows/apply-ferrara-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2.8-ferrara-library-ingest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extend canonical Library catalog
        run: python scripts/patch-ferrara-library.py
      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- library/catalog.json; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/catalog.json
          git commit -m 'feat: register Ferrara source and study in Temple Library'
          git push origin HEAD:feature/v5.2.8-ferrara-library-ingest
