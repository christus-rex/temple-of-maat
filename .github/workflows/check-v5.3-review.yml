name: Check v5.3 review candidate

on:
  push:
    branches:
      - 'review/v5.3-threshold-refinement'
    paths:
      - '.github/workflows/check-v5.3-review.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v5.3-threshold-refinement

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate repository release rules
        run: node scripts/validate-v5.mjs --release

      - name: Check enhancement JavaScript syntax
        run: |
          node --check sw.js
          node --check scripts/v5.3-threshold.js

      - name: Verify public threshold markers
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          required = [
              "<title>Temple of Ma'at — 72 Chamber Archive</title>",
              'rel="canonical" href="https://christus-rex.github.io/temple-of-maat/"',
              'id="temple-static-entry"',
              './styles/v5.3-threshold.css',
              './scripts/v5.3-threshold.js',
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit(f'Missing index marker: {marker}')
          if '<title>React Artifact</title>' in html:
              raise SystemExit('Legacy React Artifact title still present')
          if 'CACHE_CHAMBER' not in sw or 'CACHE_FULL_TEMPLE' not in sw:
              raise SystemExit('Progressive cache message handlers are missing')
          install = sw.split("self.addEventListener('install'", 1)[1].split("self.addEventListener('activate'", 1)[0]
          if 'allDisplayAssets()' in install or 'chamberDisplayAssets(' in install:
              raise SystemExit('Install path still precaches the full chamber visual set')
          print('Public threshold and progressive cache markers verified')
          PY
