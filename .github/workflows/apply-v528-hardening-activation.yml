name: Apply v5.2.8 hardening activation patch

on:
  push:
    branches:
      - feature/v5.2.8-release-hardening
    paths:
      - 'scripts/patch-v528-hardening-activation.py'
      - '.github/workflows/apply-v528-hardening-activation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2.8-release-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-v528-hardening-activation.py
      - name: Commit hardening smoke patch if changed
        run: |
          if git diff --quiet -- scripts/smoke-release-hardening-v5.2.8.mjs; then
            echo 'Hardening activation patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke-release-hardening-v5.2.8.mjs
          git commit -m 'test: wait for service-worker activation cleanup'
          git push origin HEAD:feature/v5.2.8-release-hardening
