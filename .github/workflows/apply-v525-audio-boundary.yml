name: Apply v5.2.5 audio-boundary cleanup

on:
  push:
    branches: [feature/v5.2.5-living-temple]
    paths:
      - '.github/workflows/apply-v525-audio-boundary.yml'
      - 'scripts/patch-v525-audio-boundary.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove unpublished network-audio claims
        run: python scripts/patch-v525-audio-boundary.py
      - name: Validate product source
        run: |
          node --check scripts/v5.2.5-living-temple.js
          node scripts/validate-v5.mjs --release
          node scripts/validate-v5.2.5.mjs
      - name: Commit product cleanup
        run: |
          git config user.name "Temple Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/v5.2.5-living-temple.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: let v5.2.5 media vault own chant source"
          git push origin HEAD:feature/v5.2.5-living-temple
