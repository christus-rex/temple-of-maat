name: Run v5.2.3 wallpaper smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-wallpaper-smoke.yml'
      - 'scripts/smoke-parental-powers.mjs'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install smoke-test dependencies
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Run wallpaper download smoke test
        run: |
          mkdir -p work
          TEMPLE_PYTHON=python3 node scripts/smoke-parental-powers.mjs
