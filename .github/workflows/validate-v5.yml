name: Validate Temple v5

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check critical runtime scripts
        run: |
          node --check sw.js
          node --check scripts/v5.3-threshold.js
          node --check scripts/v5.4.3-mobile-hardening.js
          node --check scripts/v5.4.4-signature-book-semantics.js
          node --check scripts/v5.4.5-release-status.js
          node --check scripts/v5.5-living-archive.js
          node --check scripts/persistent-data.js
          node --check scripts/update-temple-health.mjs
      - name: Validate v5 structural contract
        run: |
          VERSION=$(node -p "require('./version.json').version")
          if [ "$VERSION" = "5.4.0" ] || [ "$VERSION" = "5.5.0" ] || [ "$VERSION" = "5.5.1" ]; then
            node scripts/validate-v5.mjs
          else
            node scripts/validate-v5.mjs --release
          fi
      - name: Validate legacy v5.2 invariant contracts
        run: |
          VERSION=$(node -p "require('./version.json').version")
          if [ "$VERSION" = "5.4.0" ] || [ "$VERSION" = "5.5.0" ] || [ "$VERSION" = "5.5.1" ]; then
            echo "Current v5.4/v5.5 releases use the current-release validator for cache/release identity; dedicated v5.2 browser smoke workflows still verify legacy UX invariants."
          else
            node scripts/validate-v5.2.4.mjs
            node scripts/validate-v5.2.5.mjs
          fi
      - run: node scripts/validate-current-release.mjs
      - run: node scripts/validate-living-archive-v5.5.mjs
      - run: node scripts/validate-mobile-hardening-v5.4.3.mjs
      - run: node scripts/validate-quality-gates-v5.4.mjs
      - run: node scripts/validate-chant-web-rendition-v5.2.8.mjs
      - run: node scripts/validate-library-v1.mjs
      - run: node scripts/validate-library-buddha.mjs
      - run: node scripts/validate-library-dead-sea-scrolls.mjs
      - run: node scripts/validate-library-quran.mjs
      - run: node scripts/validate-library-ferrara.mjs
      - run: node scripts/validate-library-ui.mjs
      - run: node scripts/validate-journey-import-v1.mjs
      - run: node scripts/validate-offline-controls-v1.mjs
      - run: node scripts/validate-enoch-pilgrimage-v1.mjs
      - run: node scripts/validate-pistis-sophia-pilgrimage-v1.mjs
      - run: node scripts/validate-pilgrimage-hardening-v5.3.1.mjs
      - run: node scripts/validate-relationship-graph-v1.mjs
      - run: node scripts/test-relationship-resolver-v5.3.0.mjs
      - run: node scripts/test-relationship-browser-adapter-v5.3.0.mjs
      - run: node scripts/validate-comparative-reading-v5.3.0.mjs
      - run: node scripts/test-knowledge-inspector-v5.3.0.mjs
      - run: node scripts/test-research-notebook-v5.3.0.mjs
      - run: node scripts/test-scribe-workspace-v5.3.0.mjs
      - run: node scripts/validate-knowledge-kernel-v1.mjs
      - run: node scripts/validate-pair-authority-v1.mjs
      - run: node scripts/validate-pair-authority-audit-v1.mjs
      - run: node scripts/validate-living-temple-map-v5.3.3.mjs
      - run: node scripts/validate-living-correspondence-engine-v5.3.4.mjs
