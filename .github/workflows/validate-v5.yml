name: Validate Temple v5

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-v5.mjs --release
      - run: node scripts/validate-v5.2.4.mjs
      - run: node scripts/validate-v5.2.5.mjs
      - run: node scripts/validate-v5.2.8-release.mjs
      - run: node scripts/validate-welcome-version-v5.2.8.mjs
      - run: node scripts/validate-chant-web-rendition-v5.2.8.mjs
      - run: node scripts/validate-library-v1.mjs
      - run: node scripts/validate-library-buddha.mjs
      - run: node scripts/validate-library-dead-sea-scrolls.mjs
      - run: node scripts/validate-library-quran.mjs
      - run: node scripts/validate-library-ferrara.mjs
      - run: node scripts/validate-library-ui.mjs
      - run: node scripts/validate-journey-import-v1.mjs
      - run: node scripts/validate-offline-controls-v1.mjs
      - run: node scripts/validate-relationship-graph-v1.mjs
      - run: node scripts/validate-knowledge-kernel-v1.mjs
      - run: node scripts/validate-enoch-pilgrimage-v1.mjs
