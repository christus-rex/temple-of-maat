name: Smoke Journey import v5.2.8

on:
  pull_request:
    paths:
      - 'scripts/v5.2.8-journey-import.js'
      - 'styles/v5.2.8-journey-import.css'
      - 'docs/JOURNEY_PORTABILITY.md'
      - 'scripts/smoke-journey-import-v5.2.8.mjs'
      - 'scripts/v5.3-threshold.js'
      - '.github/workflows/smoke-journey-import-v5.2.8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Export, reject invalid, restore, reload, and verify merge safety
        run: TEMPLE_PYTHON=python3 node scripts/smoke-journey-import-v5.2.8.mjs
