name: Materialize chant web rendition

on:
  push:
    branches:
      - fix/chant-streaming-drive-archive
    paths:
      - .github/workflows/materialize-chant-web-rendition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chant branch
        uses: actions/checkout@v4
        with:
          ref: fix/chant-streaming-drive-archive
          fetch-depth: 0

      - name: Download staged web rendition from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl --fail --location --retry 4 --retry-all-errors \
            'https://drive.usercontent.google.com/download?id=1j_vY7rYpnm3BlMsC2QLE6S1-lRj91nTc&export=download&confirm=t' \
            --output assets/audio/maat-forty-two-declarations.web.opus
          test "$(stat -c%s assets/audio/maat-forty-two-declarations.web.opus)" = '1336596'
          test "$(sha256sum assets/audio/maat-forty-two-declarations.web.opus | awk '{print $1}')" = 'b82360e17adf2240ca8ac8071a8d20ce295bfb6c38f143a4b3367ab90afee94b'

      - name: Commit verified web rendition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/maat-forty-two-declarations.web.opus
          if git diff --cached --quiet; then
            echo 'Verified web rendition already materialized.'
            exit 0
          fi
          git commit -m 'media: publish verified Ma’at chant web rendition'
          git push origin HEAD:fix/chant-streaming-drive-archive
