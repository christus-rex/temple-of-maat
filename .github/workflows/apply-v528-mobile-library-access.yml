name: Apply v5.2.8 mobile artifact Library access

on:
  push:
    branches:
      - feature/v5.2.8-library-ui
    paths:
      - 'scripts/patch-v528-mobile-library-access.py'
      - '.github/workflows/apply-v528-mobile-library-access.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2.8-library-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-v528-mobile-library-access.py
      - name: Commit durable changes if present
        run: |
          if git diff --quiet -- scripts/v5.2.8-temple-library.js styles/v5.2.8-temple-library.css scripts/smoke-library-v5.2.8.mjs scripts/diagnose-live-wallpapers.mjs; then
            echo 'Mobile Library access patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5.2.8-temple-library.js styles/v5.2.8-temple-library.css scripts/smoke-library-v5.2.8.mjs scripts/diagnose-live-wallpapers.mjs
          git commit -m 'fix: preserve mobile Library access without blocking artifact downloads'
          git push origin HEAD:feature/v5.2.8-library-ui
