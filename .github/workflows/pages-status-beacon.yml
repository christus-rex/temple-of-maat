name: Pages Status Beacon

on:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:

concurrency:
  group: pages-status-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pages: read

jobs:
  publish-pages-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish connector-readable Pages beacon
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '68'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BUILD: ${{ toJSON(github.event.build) }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -u
          UTC_NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          STATUS=""
          COMMIT="$SHA"
          UPDATED="$UTC_NOW"
          ERROR=""
          BUILD_URL=""
          EVENT_STATUS=""
          EVENT_ERROR=""
          DEPLOYMENT_SOURCE="false"

          is_terminal() {
            case "${1:-}" in
              success|succeed|succeeded|built|deployed|error|errored|failure|failed) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_success() {
            case "${1:-}" in
              success|succeed|succeeded|built|deployed) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "$EVENT_NAME" = "page_build" ]; then
            EVENT_STATUS="$(jq -r '.status // "unknown"' <<<"$EVENT_BUILD")"
            COMMIT="$(jq -r '.commit // empty' <<<"$EVENT_BUILD")"
            UPDATED="$(jq -r '.updated_at // empty' <<<"$EVENT_BUILD")"
            EVENT_ERROR="$(jq -r '.error.message // empty' <<<"$EVENT_BUILD")"
            BUILD_URL="$(jq -r '.url // empty' <<<"$EVENT_BUILD")"
            [ -n "$COMMIT" ] || COMMIT="$SHA"
            [ -n "$UPDATED" ] || UPDATED="$UTC_NOW"
          fi

          # GitHub can emit a legacy page_build error even when the modern exact-SHA
          # Pages deployment succeeds and is already serving the release. Treat the
          # exact-SHA deployment record as the authoritative delivery signal for all
          # trigger types; retain page_build state only as supplemental diagnostics.
          LAST_STATUS=""
          for attempt in $(seq 1 120); do
            DEPLOYMENT="$(gh api "repos/$REPO/pages/deployments/$COMMIT" 2>/dev/null || true)"
            if [ -n "$DEPLOYMENT" ]; then
              DEPLOYMENT_STATUS="$(jq -r '.status // empty' <<<"$DEPLOYMENT")"
              DEPLOYMENT_UPDATED="$(jq -r '.updated_at // .created_at // empty' <<<"$DEPLOYMENT")"
              DEPLOYMENT_URL="$(jq -r '.url // empty' <<<"$DEPLOYMENT")"
              if [ "$DEPLOYMENT_STATUS" != "$LAST_STATUS" ]; then
                echo "Pages deployment $COMMIT is ${DEPLOYMENT_STATUS:-unknown} (attempt $attempt)."
                LAST_STATUS="$DEPLOYMENT_STATUS"
              fi
              if is_terminal "$DEPLOYMENT_STATUS"; then
                STATUS="$DEPLOYMENT_STATUS"
                [ -n "$DEPLOYMENT_UPDATED" ] && UPDATED="$DEPLOYMENT_UPDATED"
                [ -n "$DEPLOYMENT_URL" ] && BUILD_URL="$DEPLOYMENT_URL"
                DEPLOYMENT_SOURCE="true"
                break
              fi
            fi
            sleep 5
          done

          if [ "$DEPLOYMENT_SOURCE" != "true" ]; then
            if [ "$EVENT_NAME" = "page_build" ] && is_terminal "$EVENT_STATUS"; then
              STATUS="$EVENT_STATUS"
              ERROR="$EVENT_ERROR"
              echo "No terminal exact-SHA deployment record; falling back to terminal page_build event $EVENT_STATUS."
            else
              echo "No terminal Pages deployment record was available for $COMMIT; preserving the existing authoritative beacon."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ -n "$EVENT_STATUS" ] && [ "$EVENT_STATUS" != "$STATUS" ]; then
            ERROR="Legacy page_build event reported '$EVENT_STATUS'${EVENT_ERROR:+: $EVENT_ERROR}. Exact-SHA deployment '$STATUS' is authoritative."
            echo "$ERROR"
          fi

          CURRENT_HEAD="$(gh api "repos/$REPO/commits/main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$CURRENT_HEAD" ] && [ "$COMMIT" != "$CURRENT_HEAD" ]; then
            echo "Ignoring stale Pages result for $COMMIT; current main is $CURRENT_HEAD."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(cat <<EOF
          # Temple Pages Status Beacon

          - **event:** $EVENT_NAME
          - **pages status:** **$STATUS**
          - **commit:** \`$COMMIT\`
          - **updated:** \`$UPDATED\`
          - **beacon refreshed:** \`$UTC_NOW\`
          - **beacon workflow:** $RUN_URL
          - **authoritative source:** exact-SHA Pages deployment
          EOF
          )
          if [ -n "$BUILD_URL" ]; then BODY="$BODY
          - **Pages API record:** $BUILD_URL"; fi
          if [ -n "$EVENT_STATUS" ]; then BODY="$BODY
          - **page_build event status:** $EVENT_STATUS"; fi
          if [ -n "$ERROR" ]; then BODY="$BODY

          ## Pages diagnostic
          $ERROR"; fi
          BODY="$BODY

          This issue is maintained automatically so connector clients can read terminal GitHub Pages deployment state without treating a conflicting legacy page_build event as more authoritative than the exact-SHA deployment record."
          gh api --method PATCH "repos/$REPO/issues/$ISSUE" --raw-field body="$BODY" >/dev/null
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "record_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Publish Pages to machine-readable health record
        if: steps.pages.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEMPLE_HEALTH_COMPONENT: pages
          TEMPLE_HEALTH_STATUS: ${{ steps.pages.outputs.status }}
          TEMPLE_HEALTH_COMMIT: ${{ steps.pages.outputs.commit }}
          TEMPLE_HEALTH_UPDATED_AT: ${{ steps.pages.outputs.updated }}
          TEMPLE_HEALTH_RECORD_URL: ${{ steps.pages.outputs.record_url }}
        run: node scripts/update-temple-health.mjs
