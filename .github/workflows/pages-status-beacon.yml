name: Pages Status Beacon

on:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: read

jobs:
  publish-pages-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish connector-readable Pages beacon
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '68'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BUILD: ${{ toJSON(github.event.build) }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -u
          UTC_NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          STATUS=""
          COMMIT="$SHA"
          UPDATED="$UTC_NOW"
          ERROR=""
          BUILD_URL=""

          if [ "$EVENT_NAME" = "page_build" ]; then
            STATUS="$(jq -r '.status // "unknown"' <<<"$EVENT_BUILD")"
            COMMIT="$(jq -r '.commit // empty' <<<"$EVENT_BUILD")"
            UPDATED="$(jq -r '.updated_at // empty' <<<"$EVENT_BUILD")"
            ERROR="$(jq -r '.error.message // empty' <<<"$EVENT_BUILD")"
            BUILD_URL="$(jq -r '.url // empty' <<<"$EVENT_BUILD")"
            [ -n "$COMMIT" ] || COMMIT="$SHA"
            [ -n "$UPDATED" ] || UPDATED="$UTC_NOW"
          else
            for attempt in $(seq 1 24); do
              DEPLOYMENT="$(gh api "repos/$REPO/pages/deployments/$SHA" 2>/dev/null || true)"
              if [ -n "$DEPLOYMENT" ]; then
                STATUS="$(jq -r '.status // empty' <<<"$DEPLOYMENT")"
                UPDATED="$(jq -r '.updated_at // .created_at // empty' <<<"$DEPLOYMENT")"
                BUILD_URL="$(jq -r '.url // empty' <<<"$DEPLOYMENT")"
                [ -n "$UPDATED" ] || UPDATED="$UTC_NOW"
                [ -n "$STATUS" ] && break
              fi
              sleep 5
            done

            if [ -z "$STATUS" ]; then
              echo "No concrete Pages deployment record was available for $SHA; preserving the existing beacon."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          BODY=$(cat <<EOF
          # Temple Pages Status Beacon

          - **event:** $EVENT_NAME
          - **pages status:** **$STATUS**
          - **commit:** \`$COMMIT\`
          - **updated:** \`$UPDATED\`
          - **beacon refreshed:** \`$UTC_NOW\`
          - **beacon workflow:** $RUN_URL
          EOF
          )

          if [ -n "$BUILD_URL" ]; then
            BODY="$BODY
          - **Pages API record:** $BUILD_URL"
          fi

          if [ -n "$ERROR" ]; then
            BODY="$BODY

          ## Pages error
          $ERROR"
          fi

          BODY="$BODY

          This issue is maintained automatically so connector clients can read GitHub Pages build/deployment state without relying on push workflow-run enumeration."
          gh api --method PATCH "repos/$REPO/issues/$ISSUE" --raw-field body="$BODY" >/dev/null
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "record_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Publish Pages to machine-readable health record
        if: steps.pages.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEMPLE_HEALTH_COMPONENT: pages
          TEMPLE_HEALTH_STATUS: ${{ steps.pages.outputs.status }}
          TEMPLE_HEALTH_COMMIT: ${{ steps.pages.outputs.commit }}
          TEMPLE_HEALTH_UPDATED_AT: ${{ steps.pages.outputs.updated }}
          TEMPLE_HEALTH_RECORD_URL: ${{ steps.pages.outputs.record_url }}
        run: node scripts/update-temple-health.mjs
