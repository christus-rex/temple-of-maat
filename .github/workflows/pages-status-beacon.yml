name: Pages Status Beacon

on:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: read

jobs:
  publish-pages-status:
    runs-on: ubuntu-latest
    steps:
      - name: Publish connector-readable Pages beacon
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '68'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BUILD: ${{ toJSON(github.event.build) }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -u
          UTC_NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          STATUS=""
          COMMIT="$SHA"
          UPDATED="$UTC_NOW"
          ERROR=""
          BUILD_URL=""

          if [ "$EVENT_NAME" = "page_build" ]; then
            STATUS="$(jq -r '.status // "unknown"' <<<"$EVENT_BUILD")"
            COMMIT="$(jq -r '.commit // empty' <<<"$EVENT_BUILD")"
            UPDATED="$(jq -r '.updated_at // empty' <<<"$EVENT_BUILD")"
            ERROR="$(jq -r '.error.message // empty' <<<"$EVENT_BUILD")"
            BUILD_URL="$(jq -r '.url // empty' <<<"$EVENT_BUILD")"
            [ -n "$COMMIT" ] || COMMIT="$SHA"
            [ -n "$UPDATED" ] || UPDATED="$UTC_NOW"
          else
            # Push visibility fallback: the ChatGPT GitHub connector currently does
            # not enumerate push-triggered workflow runs. Poll the official Pages
            # deployment endpoint by commit SHA and only publish when GitHub returns
            # a concrete deployment record, so an earlier authoritative page_build
            # failure cannot be overwritten by an inconclusive 404/pending probe.
            for attempt in $(seq 1 24); do
              DEPLOYMENT="$(gh api "repos/$REPO/pages/deployments/$SHA" 2>/dev/null || true)"
              if [ -n "$DEPLOYMENT" ]; then
                STATUS="$(jq -r '.status // empty' <<<"$DEPLOYMENT")"
                UPDATED="$(jq -r '.updated_at // .created_at // empty' <<<"$DEPLOYMENT")"
                BUILD_URL="$(jq -r '.url // empty' <<<"$DEPLOYMENT")"
                [ -n "$UPDATED" ] || UPDATED="$UTC_NOW"
                [ -n "$STATUS" ] && break
              fi
              sleep 5
            done

            if [ -z "$STATUS" ]; then
              echo "No concrete Pages deployment record was available for $SHA; preserving the existing beacon."
              exit 0
            fi
          fi

          BODY=$(cat <<EOF
          # Temple Pages Status Beacon

          - **event:** $EVENT_NAME
          - **pages status:** **$STATUS**
          - **commit:** \`$COMMIT\`
          - **updated:** \`$UPDATED\`
          - **beacon refreshed:** \`$UTC_NOW\`
          - **beacon workflow:** $RUN_URL
          EOF
          )

          if [ -n "$BUILD_URL" ]; then
            BODY="$BODY
          - **Pages API record:** $BUILD_URL"
          fi

          if [ -n "$ERROR" ]; then
            BODY="$BODY

          ## Pages error
          $ERROR"
          fi

          BODY="$BODY

          This issue is maintained automatically so connector clients can read GitHub Pages build/deployment state without relying on push workflow-run enumeration."
          gh api --method PATCH "repos/$REPO/issues/$ISSUE" --raw-field body="$BODY" >/dev/null
