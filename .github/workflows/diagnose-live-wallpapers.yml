name: Diagnose live wallpaper downloads

on:
  pull_request:
    paths:
      - 'scripts/diagnose-live-wallpapers.mjs'
      - '.github/workflows/diagnose-live-wallpapers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-wallpapers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Exercise deployed wallpaper exports
        run: node scripts/diagnose-live-wallpapers.mjs
