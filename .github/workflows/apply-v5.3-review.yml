name: Apply v5.3 review patch

on:
  push:
    branches:
      - 'review/v5.3-threshold-refinement'
    paths:
      - '.github/workflows/apply-v5.3-review.yml'

permissions:
  contents: write

jobs:
  patch-review-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/v5.3-threshold-refinement

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply shell patch
        run: python scripts/apply-v5.3-review.py

      - name: Validate review candidate
        run: node scripts/validate-v5.mjs

      - name: Commit review patch
        run: |
          git config user.name "Temple Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scripts/validate-v5.mjs
          git commit -m "feat(v5.3): add public threshold and metadata"
          git push origin HEAD:review/v5.3-threshold-refinement
