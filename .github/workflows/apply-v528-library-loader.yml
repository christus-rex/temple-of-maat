name: Apply v5.2.8 Library loader patch

on:
  push:
    branches:
      - feature/v5.2.8-library-ui
    paths:
      - 'scripts/patch-v528-library-loader.py'
      - '.github/workflows/apply-v528-library-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.2.8-library-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-v528-library-loader.py
      - name: Commit loader if changed
        run: |
          if git diff --quiet -- scripts/v5.3-threshold.js; then
            echo 'Loader already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5.3-threshold.js
          git commit -m 'feat: load Temple Library as progressive enhancement'
          git push origin HEAD:feature/v5.2.8-library-ui
