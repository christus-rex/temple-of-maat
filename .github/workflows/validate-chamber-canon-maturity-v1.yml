name: Validate Chamber Canon Maturity v1

on:
  push:
    paths:
      - 'chambers.json'
      - 'research/chamber-canon-maturity.v1.json'
      - 'research/relationship-graph.json'
      - 'docs/CANON_1_0_READINESS.md'
      - 'docs/CHAMBER_CANON_TEMPLATE.md'
      - 'scripts/validate-chamber-canon-maturity-v1.mjs'
      - '.github/workflows/validate-chamber-canon-maturity-v1.yml'
  pull_request:
    paths:
      - 'chambers.json'
      - 'research/chamber-canon-maturity.v1.json'
      - 'research/relationship-graph.json'
      - 'docs/CANON_1_0_READINESS.md'
      - 'docs/CHAMBER_CANON_TEMPLATE.md'
      - 'scripts/validate-chamber-canon-maturity-v1.mjs'
      - '.github/workflows/validate-chamber-canon-maturity-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check scripts/validate-chamber-canon-maturity-v1.mjs
      - name: Validate Canon 1.0 chamber baseline
        run: node scripts/validate-chamber-canon-maturity-v1.mjs
