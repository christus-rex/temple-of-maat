name: Apply v5.3.0 resolver provider lifecycle patch

on:
  push:
    branches:
      - feature/v5.3.0-relationship-resolver
    paths:
      - 'scripts/patch-v530-resolver-provider.py'
      - '.github/workflows/apply-v530-resolver-provider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v5.3.0-relationship-resolver
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-v530-resolver-provider.py
      - name: Commit resolver lifecycle fix if changed
        run: |
          if git diff --quiet -- scripts/v5.3.0-relationship-resolver.mjs; then
            echo 'Resolver provider lifecycle already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5.3.0-relationship-resolver.mjs
          git commit -m 'fix: initialize relationship providers after API construction'
          git push origin HEAD:feature/v5.3.0-relationship-resolver
