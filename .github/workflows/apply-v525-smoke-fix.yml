name: Apply v5.2.5 smoke persistence fix

on:
  push:
    branches: [feature/v5.2.5-living-temple]
    paths:
      - '.github/workflows/apply-v525-smoke-fix.yml'
      - 'scripts/patch-v525-smoke.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch persistence smoke
        run: python scripts/patch-v525-smoke.py
      - name: Validate syntax and release guards
        run: |
          node --check scripts/smoke-v5.2.5.mjs
          node scripts/validate-v5.mjs --release
          node scripts/validate-v5.2.5.mjs
      - name: Commit smoke fix
        run: |
          git config user.name "Temple Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/smoke-v5.2.5.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: preserve v5.2.5 state across reload smoke"
          git push origin HEAD:feature/v5.2.5-living-temple
