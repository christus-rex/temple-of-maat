name: Validate Research Notebook v5.3.0

on:
  pull_request:
    paths:
      - 'research/schema/research-notebook-state.v1.schema.json'
      - 'scripts/v5.3.0-research-notebook.mjs'
      - 'scripts/v5.3.0-research-notebook-ui.mjs'
      - 'styles/v5.3.0-research-notebook.css'
      - 'scripts/test-research-notebook-v5.3.0.mjs'
      - 'scripts/smoke-research-notebook-v5.3.0.mjs'
      - 'docs/RESEARCH_NOTEBOOK.md'
      - '.github/workflows/validate-research-notebook-v5.3.0.yml'
      - '.github/workflows/validate-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate private-state, citations, and consent contract
        run: node scripts/test-research-notebook-v5.3.0.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise private Notebook inside Comparative Reading
        run: TEMPLE_PYTHON=python3 node scripts/smoke-research-notebook-v5.3.0.mjs
      - name: Preserve Research Notebook screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-notebook-v5.3.0
          path: work/research-notebook-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
