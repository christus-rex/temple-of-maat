name: Verify Deployed Temple

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'sw.js'
      - 'index.html'
      - 'chambers.json'
      - 'assets/**'
      - 'scripts/**'
      - 'styles/**'
      - 'library/**'
      - 'pilgrimages/**'
      - 'PWA-CHECKLIST.md'
      - 'docs/RELEASE_VERIFICATION.md'
      - '.github/workflows/verify-deployed-v5.2.8.yml'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Deployed Temple origin to verify'
        required: true
        default: 'https://christus-rex.github.io/temple-of-maat/'
      expected_version:
        description: 'Expected version.json version'
        required: true
        default: '5.4.0'
      expected_build:
        description: 'Expected version.json build'
        required: true
        default: '2026-08-16-v5.4-canonical-identity'

permissions:
  contents: read
  actions: read
  pages: read

jobs:
  deployed-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release identity from version.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "TEMPLE_EXPECTED_VERSION=$(node -p \"require('./version.json').version\")" >> "$GITHUB_ENV"
          echo "TEMPLE_EXPECTED_BUILD=$(node -p \"require('./version.json').build\")" >> "$GITHUB_ENV"
          echo "TEMPLE_LIVE_URL=https://christus-rex.github.io/temple-of-maat/" >> "$GITHUB_ENV"

      - name: Resolve manual release identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "TEMPLE_EXPECTED_VERSION=${{ inputs.expected_version }}" >> "$GITHUB_ENV"
          echo "TEMPLE_EXPECTED_BUILD=${{ inputs.expected_build }}" >> "$GITHUB_ENV"
          echo "TEMPLE_LIVE_URL=${{ inputs.live_url }}" >> "$GITHUB_ENV"

      - name: Wait for exact-SHA Pages deployment
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-pages-deployment-v5.2.8.mjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify deployed release and responsive visual geometry
        run: node scripts/verify-deployed-v5.2.8.mjs

      - name: Verify deployed chant streaming transport
        run: node scripts/smoke-chant-streaming-v5.2.8.mjs

      - name: Preserve deployed-origin screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-origin-visual-regression-${{ github.sha }}
          path: work/deployed-verification/
          if-no-files-found: warn
          retention-days: 30
