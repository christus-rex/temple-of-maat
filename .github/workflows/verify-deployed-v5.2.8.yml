name: Verify Deployed Temple v5.2.8

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'sw.js'
      - 'index.html'
      - 'chambers.json'
      - 'assets/audio/**'
      - 'scripts/**'
      - 'styles/**'
      - 'library/**'
      - 'PWA-CHECKLIST.md'
      - 'docs/RELEASE_VERIFICATION.md'
      - '.github/workflows/verify-deployed-v5.2.8.yml'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Deployed Temple origin to verify'
        required: true
        default: 'https://christus-rex.github.io/temple-of-maat/'
      expected_version:
        description: 'Expected version.json version'
        required: true
        default: '5.2.8'
      expected_build:
        description: 'Expected version.json build'
        required: true
        default: '2026-08-14-v5.2.8-library-journey-offline-hardening'

permissions:
  contents: read
  actions: read

jobs:
  deployed-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for exact-SHA Pages deployment
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEMPLE_LIVE_URL: 'https://christus-rex.github.io/temple-of-maat/'
          TEMPLE_EXPECTED_VERSION: '5.2.8'
          TEMPLE_EXPECTED_BUILD: '2026-08-14-v5.2.8-library-journey-offline-hardening'
        run: node scripts/wait-for-pages-deployment-v5.2.8.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify exact deployed release
        env:
          TEMPLE_LIVE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url || 'https://christus-rex.github.io/temple-of-maat/' }}
          TEMPLE_EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '5.2.8' }}
          TEMPLE_EXPECTED_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_build || '2026-08-14-v5.2.8-library-journey-offline-hardening' }}
        run: node scripts/verify-deployed-v5.2.8.mjs
      - name: Verify deployed chant streaming transport
        env:
          TEMPLE_LIVE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url || 'https://christus-rex.github.io/temple-of-maat/' }}
        run: node scripts/smoke-chant-streaming-v5.2.8.mjs
      - name: Preserve deployed-origin screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.2.8-deployed-origin-screenshots
          path: work/deployed-verification/
          if-no-files-found: warn
          retention-days: 30
