name: Verify Deployed Temple

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Deployed Temple origin to verify'
        required: true
        default: 'https://christus-rex.github.io/temple-of-maat/'
      expected_version:
        description: 'Expected version.json version'
        required: true
        default: '5.4.0'
      expected_build:
        description: 'Expected version.json build'
        required: true
        default: '2026-08-16-v5.4-canonical-identity'

permissions:
  contents: write
  actions: read
  pages: read
  issues: write

jobs:
  deployed-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release identity from version.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(node -p "require('./version.json').version")
          BUILD=$(node -p "require('./version.json').build")
          echo "TEMPLE_EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TEMPLE_EXPECTED_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TEMPLE_LIVE_URL=https://christus-rex.github.io/temple-of-maat/" >> "$GITHUB_ENV"

      - name: Resolve manual release identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "TEMPLE_EXPECTED_VERSION=${{ inputs.expected_version }}" >> "$GITHUB_ENV"
          echo "TEMPLE_EXPECTED_BUILD=${{ inputs.expected_build }}" >> "$GITHUB_ENV"
          echo "TEMPLE_LIVE_URL=${{ inputs.live_url }}" >> "$GITHUB_ENV"

      - name: Wait for exact-SHA Pages deployment
        id: pages_wait
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if node scripts/wait-for-pages-deployment-v5.2.8.mjs; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Resolve Pages verification gate
        id: pages_gate
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_RESULT: ${{ steps.pages_wait.outputs.result }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RESULT=success
          else
            RESULT="${PUSH_RESULT:-failure}"
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        if: steps.pages_gate.outputs.result == 'success'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Diagnose deployed resource failures
        id: network
        if: steps.pages_gate.outputs.result == 'success'
        shell: bash
        run: |
          if node scripts/diagnose-deployed-network-v5.4.mjs; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Verify deployed release and responsive visual geometry
        id: visual
        if: steps.pages_gate.outputs.result == 'success'
        shell: bash
        run: |
          if node scripts/verify-deployed-v5.2.8.mjs; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Verify deployed chant streaming transport
        id: chant
        if: steps.pages_gate.outputs.result == 'success'
        shell: bash
        run: |
          if node scripts/smoke-chant-streaming-v5.4.mjs; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Publish deployed verification beacon
        id: deployed_result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '71'
          SHA: ${{ github.sha }}
          PAGES_WAIT: ${{ steps.pages_gate.outputs.result }}
          NETWORK: ${{ steps.network.outputs.result }}
          VISUAL: ${{ steps.visual.outputs.result }}
          CHANT: ${{ steps.chant.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          RESULT=success
          for value in "$PAGES_WAIT" "$NETWORK" "$VISUAL" "$CHANT"; do
            if [ "$value" != "success" ]; then RESULT=failure; fi
          done
          UTC_NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BODY=$(cat <<EOF
          # Temple Deployed Verification Beacon

          - **overall:** **$RESULT**
          - **commit:** \`$SHA\`
          - **updated:** \`$UTC_NOW\`
          - **workflow run:** $RUN_URL
          - **live origin:** $TEMPLE_LIVE_URL
          - **expected release:** \`$TEMPLE_EXPECTED_VERSION / $TEMPLE_EXPECTED_BUILD\`

          ## Checks
          - exact-SHA Pages wait: **$PAGES_WAIT**
          - same-origin network diagnostics: **$NETWORK**
          - responsive deployed visual regression: **$VISUAL**
          - deployed chant transport: **$CHANT**

          Responsive visual verification covers 320, 360, 412, 430, 768, and desktop widths, including Visitor Signature Book containment, chamber geometry, overlays, broken images, console errors, and screenshot evidence. Network diagnostics preserve the exact URLs and HTTP statuses for failed resources.
          EOF
          )
          gh api --method PATCH "repos/$REPO/issues/$ISSUE" --raw-field body="$BODY" >/dev/null
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "updated_at=$UTC_NOW" >> "$GITHUB_OUTPUT"

      - name: Publish deployed state to machine-readable health record
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TEMPLE_HEALTH_COMPONENT: deployed_visual
          TEMPLE_HEALTH_STATUS: ${{ steps.deployed_result.outputs.result }}
          TEMPLE_HEALTH_COMMIT: ${{ github.sha }}
          TEMPLE_HEALTH_UPDATED_AT: ${{ steps.deployed_result.outputs.updated_at }}
          TEMPLE_HEALTH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEMPLE_RELEASE_VERSION: ${{ env.TEMPLE_EXPECTED_VERSION }}
          TEMPLE_RELEASE_BUILD: ${{ env.TEMPLE_EXPECTED_BUILD }}
        run: node scripts/update-temple-health.mjs

      - name: Preserve deployed-origin screenshot and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-origin-visual-regression-${{ github.sha }}
          path: work/deployed-verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when deployed release is not green
        if: always()
        env:
          RESULT: ${{ steps.deployed_result.outputs.result }}
        shell: bash
        run: |
          test "$RESULT" = "success"
