name: Smoke Mobile Dock v5.2.8

on:
  pull_request:
    paths:
      - 'styles/v5.2.8-temple-library.css'
      - 'styles/v5.2.4-living-codex.css'
      - 'styles/v5.2.5-living-temple.css'
      - 'scripts/v5.3-threshold.js'
      - 'scripts/v5.2.4-living-codex.js'
      - 'scripts/v5.2.5-living-temple.js'
      - 'scripts/v5.2.8-temple-library.js'
      - 'scripts/v5.2.8-offline-controls.js'
      - 'scripts/smoke-mobile-dock-v5.2.8.mjs'
      - '.github/workflows/smoke-mobile-dock-v5.2.8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-dock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify narrow-screen dock alignment
        run: TEMPLE_PYTHON=python3 node scripts/smoke-mobile-dock-v5.2.8.mjs
      - name: Preserve mobile dock screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dock-v5.2.8
          path: work/mobile-dock-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
