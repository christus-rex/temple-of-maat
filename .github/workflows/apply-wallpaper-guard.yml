name: Apply wallpaper regression guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wallpaper-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch validator and smoke test
        run: python scripts/apply-wallpaper-guard.py
      - name: Validate v5.2.3 wallpaper guarantees
        run: |
          node scripts/validate-v5.mjs --release
          node --check scripts/smoke-parental-powers.mjs
      - name: Commit regression guard
        run: |
          git config user.name "Temple Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate-v5.mjs scripts/smoke-parental-powers.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: protect v5.2.3 wallpaper downloads"
          git push origin HEAD:main
