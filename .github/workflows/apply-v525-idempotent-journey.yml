name: Apply v5.2.5 idempotent journey fix

on:
  push:
    branches: [feature/v5.2.5-living-temple]
    paths:
      - '.github/workflows/apply-v525-idempotent-journey.yml'
      - 'scripts/patch-v525-idempotent-journey.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make visit tracking idempotent
        run: python scripts/patch-v525-idempotent-journey.py
      - name: Validate patched release
        run: |
          node --check scripts/v5.2.5-living-temple.js
          node scripts/validate-v5.mjs --release
          node scripts/validate-v5.2.5.mjs
      - name: Commit journey fix
        run: |
          git config user.name "Temple Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/v5.2.5-living-temple.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make v5.2.5 journey tracking idempotent"
          git push origin HEAD:feature/v5.2.5-living-temple
