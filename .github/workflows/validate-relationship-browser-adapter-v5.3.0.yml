name: Validate Relationship Browser Adapter v5.3.0

on:
  pull_request:
    paths:
      - 'research/relationship-graph.json'
      - 'research/relationship-graph.schema.json'
      - 'library/catalog.json'
      - 'chambers.json'
      - 'scripts/v5.2.4-living-codex.js'
      - 'scripts/v5.2.6-shem-dossiers.js'
      - 'scripts/v5.3.0-relationship-resolver.mjs'
      - 'scripts/v5.3.0-relationship-browser-adapter.mjs'
      - 'scripts/test-relationship-browser-adapter-v5.3.0.mjs'
      - 'scripts/smoke-relationship-browser-adapter-v5.3.0.mjs'
      - 'docs/RELATIONSHIP_BROWSER_ADAPTER.md'
      - '.github/workflows/validate-relationship-browser-adapter-v5.3.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate canonical provider semantics
        run: node scripts/test-relationship-browser-adapter-v5.3.0.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise browser adapter against live Temple runtime
        run: TEMPLE_PYTHON=python3 node scripts/smoke-relationship-browser-adapter-v5.3.0.mjs
