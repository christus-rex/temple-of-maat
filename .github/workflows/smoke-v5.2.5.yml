name: Smoke Temple v5.2.5

on:
  pull_request:
    paths:
      - 'index.html'
      - 'version.json'
      - 'sw.js'
      - 'scripts/v5.3-threshold.js'
      - 'scripts/v5.2.4-*.js'
      - 'scripts/v5.2.5-*.js'
      - 'styles/v5.2.4-*.css'
      - 'styles/v5.2.5-*.css'
      - 'assets/audio/maat-forty-two-declarations.json'
      - 'scripts/smoke-parental-powers.mjs'
      - 'scripts/smoke-v5.2.4.mjs'
      - 'scripts/smoke-v5.2.5.mjs'
      - '.github/workflows/smoke-v5.2.5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-v525-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser-test dependencies
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Verify existing collectible downloads
        run: |
          mkdir -p work
          TEMPLE_PYTHON=python3 node scripts/smoke-parental-powers.mjs
      - name: Verify Living Codex journey
        run: TEMPLE_PYTHON=python3 node scripts/smoke-v5.2.4.mjs
      - name: Verify Living Temple journey
        run: TEMPLE_PYTHON=python3 node scripts/smoke-v5.2.5.mjs
